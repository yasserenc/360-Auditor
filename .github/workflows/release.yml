name: Release independently validated Skill

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: skill-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that tag commit is merged into main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main

      - name: Install pinned YAML validation dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'

      - name: Verify tag/ref identity and unused release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_guard.py

      - name: Run source and behavioral-contract structural tests
        run: |
          python scripts/skill_bundle.py check
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build and independently inspect candidate archive
        run: |
          python scripts/skill_bundle.py build
          python scripts/skill_bundle.py verify
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Require actual host and matched behavioral acceptance records
        run: python scripts/release_acceptance.py

      - name: Transfer only validated static release bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-release-bytes
          path: |
            dist/skill.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Fetch only validated release bytes, no repository checkout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-release-bytes
          path: dist

      - name: Verify final archive digest before publication
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Publish exactly one never-before-published version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "invalid tag name" >&2
            exit 1
          fi

          # Re-read mutable remote ref using the privileged job token.
          ref_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --jq '.object.type')"
          ref_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --jq '.object.sha')"
          if [[ "${ref_type}" == "tag" ]]; then
            ref_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${ref_sha}" --jq '.object.sha')"
          elif [[ "${ref_type}" != "commit" ]]; then
            echo "unexpected Git tag object type" >&2
            exit 1
          fi
          if [[ "${ref_sha}" != "${GITHUB_SHA}" ]]; then
            echo "tag ref changed or does not match artifact source" >&2
            exit 1
          fi

          # Existing releases must never be edited/clobbered. Only 404 is absent.
          set +e
          response="$(gh api -i "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" 2>&1)"
          code=$?
          set -e
          if [[ "${code}" == "0" ]]; then
            echo "release already exists; refusal to overwrite" >&2
            exit 1
          fi
          if ! printf '$s\n' "${response}" | grep -Eq '^HTTP/[^ ]+ 404'; then
            echo "cannot confirm unused version (not authenticated 404)" >&2
            exit 1
          fi

          sha256="$(cut -d ' ' -f1 dist/SHA256SUMS.txt)"
          cat > /tmp/new-release-notes.md <<EOF_NOTES
          # 360 Output Auditor ${VERSION}

          Validated corrective release of the 360 Output Auditor Skill.
          Source/tag commit: ${GITHUB_SHA}
          skill.zip SHA-256: ${sha256}

          The four-way verdict is a breaking interface change; see CHANGELOG and README. Actual host and behavior acceptance evidence is retained in tests/eval.
          EOF_NOTES

          gh release create "${VERSION}" dist/skill.zip dist/SHA256SUMS.txt \
            --verify-tag \
            --target "${GITHUB_SHA}" \
            --title "360 Output Auditor ${VERSION}" \
            --notes-file /tmp/new-release-notes.md

      - name: Verify public release downloaded bytes, not just upload success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "${VERSION}" --dir published \
            --pattern 'skill.zip' --pattern 'SHA256SUMS.txt'
          (cd published && sha256sum -c SHA256SUMS.txt)
          cmp dist/skill.zip published/skill.zip
          cmp dist/SHA256SUMS.txt published/SHA256SUMS.txt
