name: Package and release Skill

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version tag to release
        required: true
        default: v1.0.2
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: ${version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate source and build skill.zip
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          import hashlib
          import re

          root = Path(".")
          required = [
              "SKILL.md",
              "agents/openai.yaml",
              "assets/icon.svg",
              "references/code.md",
              "references/diagnosis.md",
              "references/evidence-and-claims.md",
              "references/factual-research.md",
              "references/high-stakes.md",
              "references/infrastructure.md",
              "references/plans-workflows.md",
              "references/quantitative.md",
              "references/recommendations-writing-design.md",
              "references/skill-evaluation-security.md",
              "references/tool-executed-work.md",
          ]

          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise SystemExit(f"Missing required Skill files: {missing}")

          skill = (root / "SKILL.md").read_text(encoding="utf-8")
          if not skill.startswith("---\n"):
              raise SystemExit("SKILL.md frontmatter is missing")
          if "name: output-auditor" not in skill:
              raise SystemExit("SKILL.md has an unexpected name")
          if "Do not trigger for first-pass creation" not in skill:
              raise SystemExit("SKILL.md trigger description appears incomplete")

          refs = set(re.findall(r"\((references/[^)]+\.md)\)", skill))
          missing_refs = sorted(p for p in refs if not (root / p).is_file())
          if missing_refs:
              raise SystemExit(f"Broken SKILL.md references: {missing_refs}")

          out = root / "dist"
          out.mkdir(exist_ok=True)
          archive = out / "skill.zip"

          with ZipFile(archive, "w", compression=ZIP_DEFLATED) as zf:
              for rel in required:
                  zf.write(root / rel, arcname=f"output-auditor/{rel}")

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (out / "SHA256SUMS.txt").write_text(
              f"{digest}  skill.zip\n", encoding="utf-8"
          )
          print(f"skill.zip SHA-256: {digest}")
          PY

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          sha256="$(awk '{print $1}' dist/SHA256SUMS.txt)"

          cat > /tmp/release-notes.md <<EOF
          # 360° Output Auditor ${version}

          Stable public release of the evidence-first second-pass audit Skill.

          ## Included

          - canonical \`SKILL.md\` control plane;
          - Skill Creator-compatible agent metadata and icon;
          - all 11 progressive domain references;
          - complete trigger description;
          - installable \`skill.zip\`;
          - SHA-256 checksum file.

          **skill.zip SHA-256:** \`${sha256}\`

          See \`CHANGELOG.md\` for detailed release changes.
          EOF

          if gh release view "${version}" >/dev/null 2>&1; then
            gh release upload "${version}" \
              dist/skill.zip \
              dist/SHA256SUMS.txt \
              --clobber
            gh release edit "${version}" \
              --title "360° Output Auditor ${version}" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "${version}" \
              dist/skill.zip \
              dist/SHA256SUMS.txt \
              --target "${GITHUB_SHA}" \
              --title "360° Output Auditor ${version}" \
              --notes-file /tmp/release-notes.md
          fi
